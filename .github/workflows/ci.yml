name: CI Pipeline - Patient Service

on:
  push:
    branches: [main]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout platform policies
        uses: actions/checkout@v4
        with:
          repository: guru423/medconnect-platform-config
          path: platform-config

      - name: Install Conftest
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/open-policy-agent/conftest/releases/latest | grep tag_name | cut -d '"' -f 4 | sed 's/v//')
          wget https://github.com/open-policy-agent/conftest/releases/download/v${LATEST_VERSION}/conftest_${LATEST_VERSION}_Linux_x86_64.tar.gz
          tar xzf conftest_${LATEST_VERSION}_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin

      - name: Run OPA policy checks
        run: conftest test k8s/deployment.yaml -p platform-config/policies

      - name: Build Docker image
        run: docker build -t medconnect-patient-service:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: medconnect-patient-service:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker tag medconnect-patient-service:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/medconnect-patient-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/medconnect-patient-service:latest